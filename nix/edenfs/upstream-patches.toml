# Subset of the [patch] sections of upstream's eden/fs/Cargo.toml that the
# edenfsctl dependency graph actually uses (the full list covers all of
# fbsource and would drag ~100 unused git repositories into the vendor dir).
# The facebookexperimental/cxx fork is left out on purpose: the C++ side of
# the cxx bridges is generated by nixpkgs' `cxxbridge` (cxx-rs), which has to
# match the `cxx` crate exactly (cxx 1.0.194 is pinned in Cargo.lock).
# Likewise the wezterm-* crates are not redirected to wezterm's git
# repository, because the eden/scm crates linked into EdenFS use the
# crates.io termwiz 0.23, which does not build against those.

[patch.crates-io]
backtrace = { git = "https://github.com/rust-lang/backtrace-rs", rev = "df979dcf80027eb047d7bb9e0874710c15009f31" }
bindgen = { git = "https://github.com/jsgf/rust-bindgen", rev = "4d385d21c160e6ee1f443aeb7e00528a1dc7fd44" }
darwin-libproc = { git = "https://github.com/fbsource/darwin-libproc", rev = "f73ddb1002d51ae74c1b41670fae56bd5896b7a3" }

[patch."https://github.com/wez/finl_unicode.git"]
finl_unicode = { git = "https://github.com/dahosek/finl_unicode.git", rev = "a1892f26245529f2ef3877a9ebd610c96cec07a6" }

[patch."https://github.com/wezterm/wezterm.git"]
filedescriptor = "0.8.3"
vtparse = "0.7"
wezterm-bidi = "0.2.3"
wezterm-blob-leases = "0.1.1"
wezterm-dynamic-derive = "0.1.1"

